name: CI - Build & Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test (Multi-module)
        run: mvn clean install -B jacoco:report

      - name: Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML

      - name: Quality Checks (SpotBugs & PMD)
        run: |
          mvn com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check -Dspotbugs.failOnError=true
          mvn pmd:pmd

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/**"

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: "**/dependency-check-report.*"